# Base Configuration for Enterprise Agent Platform v3
app:
  name: "Enterprise Agent Platform"
  version: "3.0.0"
  env: "dev"
  domain: "retail_store"
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["http://localhost:3000"]
  trusted_proxies: ["127.0.0.1"]

harness:
  max_steps: 8
  max_critic_cycles: 2
  grounding_threshold: 0.75
  context_token_budget: 16000
  hedge_delay_seconds: 1.5
  circuit_failure_threshold: 3
  circuit_reset_seconds: 30
  rate_limit_requests: 60
  rate_limit_window_seconds: 60

persistence:
  adapter: "memory" # memory | sqlite | postgres | redis
  sqlite_path: "agent_data.db"
  postgres_url: ""
  redis_url: ""

llm:
  provider: "scripted" # scripted | mock | openai_compat | gemini
  model_name: "default"
  temperature: 0.0
  max_tokens: 2048
  timeout_seconds: 20
  base_url: ""
  api_key: ""

pricing:
  mock:
    input_per_1k: "0.00000"
    output_per_1k: "0.00000"
  scripted:
    input_per_1k: "0.00000"
    output_per_1k: "0.00000"
  gpt-4o-mini:
    input_per_1k: "0.00015"
    output_per_1k: "0.00060"
  gemini-1.5-flash:
    input_per_1k: "0.000075"
    output_per_1k: "0.00030"

feature_flags:
  enable_pii_masking: true
  enable_sanitizer: true
  enable_injection_guard: true
  enable_hitl: true
  enable_rate_limiter: true
  enable_cache: true
