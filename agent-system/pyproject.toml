[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailmind-agent"
version = "3.0.0"
description = "RetailMind AI — Enterprise Agentic Retail Intelligence Service (ADR-007 Polyglot Edition)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.10",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "rank-bm25>=0.2.2",
    "duckdb>=1.0.0",
    "pyjwt[crypto]>=2.8.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "prometheus-client>=0.20.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-redis>=0.5.0",
    "aiosqlite>=0.20.0",
    "psycopg>=3.2.0",
    "psycopg-pool>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_platform*"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
